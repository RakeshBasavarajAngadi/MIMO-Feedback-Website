<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <defs>
    <!-- Dark Botanical Leaves in Deep Black & Charcoal -->
    <linearGradient id="leafGradDarkR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D" />
      <stop offset="100%" stop-color="#191919" />
    </linearGradient>
    <linearGradient id="leafGradMidR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D3D3D" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    
    <!-- White Lily Petal Gradients -->
    <linearGradient id="petalGrad1R" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FBF9F7" />
      <stop offset="100%" stop-color="#F0EAE1" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="petalGrad2R" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F7F5F3" />
      <stop offset="100%" stop-color="#E8DFD5" />
    </linearGradient>
    
    <!-- Caramel Orange Stamen Accents (#C47A43 & #A65F32) -->
    <linearGradient id="caramelStamenR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C47A43" />
      <stop offset="100%" stop-color="#A65F32" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlowR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#191919" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Botanical Stems & Dark Leaves -->
  <g filter="url(#softGlowR)" opacity="0.95">
    <!-- Main graceful stem curving inward -->
    <path d="M 280 400 C 260 320 235 240 190 180 C 170 150 145 120 130 70" 
          stroke="#191919" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 245 320 C 210 280 170 260 110 250" 
          stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Dark Botanical Leaf 1 -->
    <path d="M 260 350 C 290 300 300 230 255 170 C 235 220 230 280 260 350 Z" 
          fill="url(#leafGradDarkR)" />
    <path d="M 260 350 C 275 280 270 220 255 170" 
          stroke="#EADBCC" stroke-width="0.75" stroke-opacity="0.3" fill="none" />

    <!-- Dark Botanical Leaf 2 -->
    <path d="M 235 260 C 270 220 265 150 205 120 C 205 170 210 220 235 260 Z" 
          fill="url(#leafGradMidR)" opacity="0.9" />

    <!-- Dark Botanical Leaf 3 -->
    <path d="M 200 220 C 160 210 105 225 75 200 C 110 220 155 235 200 220 Z" 
          fill="url(#leafGradDarkR)" />
          
    <!-- Dark Botanical Leaf 4 -->
    <path d="M 160 130 C 140 80 90 50 40 40 C 80 70 115 105 160 130 Z" 
          fill="url(#leafGradMidR)" />
  </g>

  <!-- Primary White Lily Flower -->
  <g transform="translate(190, 100)" filter="url(#softGlowR)">
    <!-- Back Petals -->
    <path d="M 0 0 C 45 -50 70 -10 55 35 C 35 25 15 10 0 0 Z" 
          fill="url(#petalGrad2R)" stroke="#EADBCC" stroke-width="0.75" />
    <path d="M 0 0 C -10 -65 -50 -70 -65 -30 C -50 -5 -25 -5 0 0 Z" 
          fill="url(#petalGrad2R)" stroke="#EADBCC" stroke-width="0.75" />
    <path d="M 0 0 C 25 40 10 75 -35 65 C -30 35 -15 15 0 0 Z" 
          fill="url(#petalGrad2R)" stroke="#EADBCC" stroke-width="0.75" />

    <!-- Front Graceful Petals -->
    <path d="M 0 0 C 20 -80 -15 -100 -40 -60 C -25 -30 -10 -10 0 0 Z" 
          fill="url(#petalGrad1R)" stroke="#EADBCC" stroke-width="0.8" />
    <path d="M 0 0 C 70 -20 85 25 50 60 C 30 40 15 20 0 0 Z" 
          fill="url(#petalGrad1R)" stroke="#EADBCC" stroke-width="0.8" />
    <path d="M 0 0 C -50 15 -80 45 -60 85 C -35 60 -15 30 0 0 Z" 
          fill="url(#petalGrad1R)" stroke="#EADBCC" stroke-width="0.8" />

    <!-- Petal Rib Centerlines in Caramel Orange -->
    <path d="M 0 0 C 10 -45 -5 -75 -25 -50" stroke="#C47A43" stroke-width="0.75" stroke-opacity="0.3" fill="none" />
    <path d="M 0 0 C 40 -5 50 20 30 40" stroke="#C47A43" stroke-width="0.75" stroke-opacity="0.3" fill="none" />
    <path d="M 0 0 C -25 15 -45 35 -35 55" stroke="#C47A43" stroke-width="0.75" stroke-opacity="0.3" fill="none" />

    <!-- Stamens with Caramel Orange Anthers -->
    <path d="M 0 0 C 5 -15 10 -30 15 -42" stroke="#A65F32" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <ellipse cx="15" cy="-44" rx="3.5" ry="1.8" transform="rotate(30 15 -44)" fill="url(#caramelStamenR)" />

    <path d="M 0 0 C 0 -18 -8 -32 -18 -38" stroke="#A65F32" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <ellipse cx="-19" cy="-39" rx="3.5" ry="1.8" transform="rotate(-25 -19 -39)" fill="url(#caramelStamenR)" />

    <path d="M 0 0 C 12 0 24 8 32 12" stroke="#A65F32" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <ellipse cx="34" cy="13" rx="3.5" ry="1.8" transform="rotate(-75 34 13)" fill="url(#caramelStamenR)" />

    <path d="M 0 0 C -8 8 -18 16 -28 20" stroke="#A65F32" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <ellipse cx="-30" cy="21" rx="3.5" ry="1.8" transform="rotate(40 -30 21)" fill="url(#caramelStamenR)" />

    <!-- Flower Center Pistil -->
    <circle cx="0" cy="0" r="3.5" fill="#C47A43" />
    <circle cx="0" cy="0" r="1.5" fill="#FAF9F7" />
  </g>

  <!-- Secondary Smaller Lily Bud -->
  <g transform="translate(120, 240) scale(0.65)" filter="url(#softGlowR)" opacity="0.9">
    <path d="M 0 0 C 25 -40 15 -70 -10 -60 C -25 -30 -15 -10 0 0 Z" fill="url(#petalGrad1R)" stroke="#EADBCC" />
    <path d="M 0 0 C -20 -35 -35 -60 -50 -40 C -40 -15 -20 0 0 0 Z" fill="url(#petalGrad2R)" stroke="#EADBCC" />
    <path d="M -5 -10 C -15 -30 -25 -45 -32 -48" stroke="#A65F32" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <ellipse cx="-33" cy="-50" rx="3" ry="1.5" fill="url(#caramelStamenR)" />
  </g>
</svg>
