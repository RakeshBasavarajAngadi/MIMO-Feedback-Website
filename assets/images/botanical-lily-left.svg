<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420" fill="none">
  <defs>
    <!-- Natural Botanical Leaf Gradients (Warm Olive, Sage & Forest Greens - No Charcoal) -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E946A" />
      <stop offset="50%" stop-color="#4E734A" />
      <stop offset="100%" stop-color="#365433" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#82A67D" />
      <stop offset="60%" stop-color="#587C54" />
      <stop offset="100%" stop-color="#3D5E39" />
    </linearGradient>
    <linearGradient id="leafGradHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BBF96" />
      <stop offset="100%" stop-color="#668B62" />
    </linearGradient>

    <!-- Graceful Botanical Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8057" />
      <stop offset="100%" stop-color="#385435" />
    </linearGradient>

    <!-- Elegant White Lily Petal Gradients (Luminous White & Soft Ivory Cream) -->
    <linearGradient id="petalWhiteMain" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#EDE2D3" />
    </linearGradient>
    <linearGradient id="petalWhiteBack" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F4ECE1" />
      <stop offset="100%" stop-color="#E2D4C3" />
    </linearGradient>
    <linearGradient id="petalBud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0E8DD" />
      <stop offset="100%" stop-color="#ABC4A3" />
    </linearGradient>

    <!-- Warm Caramel Pollen & Anther Accents (#C47A43 & #A65F32) -->
    <linearGradient id="caramelAnther" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98A50" />
      <stop offset="50%" stop-color="#C47A43" />
      <stop offset="100%" stop-color="#9A5328" />
    </linearGradient>
    <radialGradient id="throatWarmth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A370" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#C47A43" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Ambient Warm Peach Glow Aura -->
    <radialGradient id="peachBackAura" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F4E2D2" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#F4E2D2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFF8F1" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Filter for Luminous Petals -->
    <filter id="softBotanicalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C47A43" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Ambient Peach Backing Aura -->
  <circle cx="160" cy="180" r="145" fill="url(#peachBackAura)" />

  <!-- Botanical Stems & Natural Green Foliage -->
  <g id="stems-and-leaves">
    <!-- Main Graceful Botanical Stems -->
    <path d="M 45 420 C 65 330 95 245 145 185 C 165 155 185 125 195 75" 
          stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 85 335 C 120 295 160 270 230 255" 
          stroke="url(#stemGrad)" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M 125 210 C 95 165 75 130 55 100" 
          stroke="url(#stemGrad)" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Natural Botanical Leaf 1 (Large Lower Graceful Leaf) -->
    <path d="M 70 370 C 35 315 25 240 75 175 C 98 230 102 295 70 370 Z" 
          fill="url(#leafGrad1)" />
    <!-- Leaf 1 Central Vein -->
    <path d="M 70 370 C 52 295 56 230 75 175" 
          stroke="#CBE0C7" stroke-width="1" stroke-opacity="0.45" fill="none" />

    <!-- Natural Botanical Leaf 2 (Upper Flared Leaf) -->
    <path d="M 95 275 C 55 230 60 155 125 122 C 125 175 120 230 95 275 Z" 
          fill="url(#leafGrad2)" opacity="0.95" />
    <path d="M 95 275 C 80 220 85 165 125 122" 
          stroke="#D5E8D2" stroke-width="0.9" stroke-opacity="0.4" fill="none" />

    <!-- Natural Botanical Leaf 3 (Right Extended Arch) -->
    <path d="M 135 230 C 180 220 240 235 275 208 C 235 230 185 245 135 230 Z" 
          fill="url(#leafGradHighlight)" />
    <path d="M 135 230 C 190 228 245 224 275 208" 
          stroke="#CBE0C7" stroke-width="0.8" stroke-opacity="0.4" fill="none" />

    <!-- Natural Botanical Leaf 4 (Top Slender Arch) -->
    <path d="M 175 135 C 195 82 250 50 305 38 C 260 70 222 108 175 135 Z" 
          fill="url(#leafGrad1)" />
    <path d="M 175 135 C 225 95 268 62 305 38" 
          stroke="#D5E8D2" stroke-width="0.8" stroke-opacity="0.35" fill="none" />

    <!-- Slender Secondary Leaf Near Bud -->
    <path d="M 115 195 C 80 170 50 145 35 110 C 60 135 90 165 115 195 Z" 
          fill="url(#leafGrad2)" opacity="0.9" />
  </g>

  <!-- Secondary Companion Lily Bud (Top Left) -->
  <g transform="translate(55, 100)" filter="url(#softBotanicalShadow)">
    <path d="M 0 0 C -12 -35 -2 -55 12 -70 C 18 -48 12 -25 0 0 Z" 
          fill="url(#petalBud)" stroke="#EADBCC" stroke-width="0.75" />
    <path d="M 0 0 C 8 -30 20 -48 30 -62 C 22 -40 12 -20 0 0 Z" 
          fill="url(#petalWhiteBack)" stroke="#EADBCC" stroke-width="0.7" opacity="0.85" />
    <!-- Bud Sepal (Green wrap) -->
    <path d="M 0 0 C -6 -18 -8 -30 -6 -40 C -2 -25 4 -12 0 0 Z" 
          fill="url(#leafGradHighlight)" opacity="0.8" />
  </g>

  <!-- Primary Blossoming White Lily Flower (Full Bloom) -->
  <g transform="translate(145, 115)" filter="url(#softBotanicalShadow)">
    <!-- Deep Back Petals -->
    <path d="M 0 0 C -52 -58 -80 -12 -62 40 C -40 28 -18 12 0 0 Z" 
          fill="url(#petalWhiteBack)" stroke="#EADBCC" stroke-width="0.8" />
    <path d="M 0 0 C 12 -75 58 -80 75 -35 C 58 -6 28 -6 0 0 Z" 
          fill="url(#petalWhiteBack)" stroke="#EADBCC" stroke-width="0.8" />
    <path d="M 0 0 C -28 45 -12 85 40 75 C 34 40 16 16 0 0 Z" 
          fill="url(#petalWhiteBack)" stroke="#EADBCC" stroke-width="0.8" />

    <!-- Center Warm Throat Glow -->
    <circle cx="0" cy="0" r="32" fill="url(#throatWarmth)" />

    <!-- Front Sculpted Luminous White Petals -->
    <!-- Top Petal -->
    <path d="M 0 0 C -24 -92 18 -115 46 -70 C 30 -35 12 -12 0 0 Z" 
          fill="url(#petalWhiteMain)" stroke="#EADBCC" stroke-width="0.9" />
    <!-- Left Flared Petal -->
    <path d="M 0 0 C -80 -22 -98 30 -58 70 C -34 46 -18 22 0 0 Z" 
          fill="url(#petalWhiteMain)" stroke="#EADBCC" stroke-width="0.9" />
    <!-- Bottom Right Petal -->
    <path d="M 0 0 C 58 18 92 52 70 98 C 40 70 18 35 0 0 Z" 
          fill="url(#petalWhiteMain)" stroke="#EADBCC" stroke-width="0.9" />

    <!-- Elegant Petal Midribs with Subtle Caramel Accents -->
    <path d="M 0 0 C -12 -52 6 -88 28 -58" 
          stroke="#C47A43" stroke-width="0.9" stroke-opacity="0.4" stroke-dasharray="120" stroke-linecap="round" fill="none" />
    <path d="M 0 0 C -46 -6 -58 24 -35 46" 
          stroke="#C47A43" stroke-width="0.9" stroke-opacity="0.4" stroke-linecap="round" fill="none" />
    <path d="M 0 0 C 30 18 52 40 42 64" 
          stroke="#C47A43" stroke-width="0.9" stroke-opacity="0.4" stroke-linecap="round" fill="none" />
    <path d="M 0 0 C -30 -35 -45 -6 -35 22" 
          stroke="#C47A43" stroke-width="0.7" stroke-opacity="0.25" stroke-linecap="round" fill="none" />
    <path d="M 0 0 C 8 -42 35 -48 42 -22" 
          stroke="#C47A43" stroke-width="0.7" stroke-opacity="0.25" stroke-linecap="round" fill="none" />

    <!-- Subtle Caramel Lily Throat Papillae (Authentic Floral Detail Dots) -->
    <circle cx="-6" cy="-14" r="1.2" fill="#C47A43" opacity="0.6" />
    <circle cx="-12" cy="-10" r="1" fill="#C47A43" opacity="0.5" />
    <circle cx="-4" cy="-22" r="1.1" fill="#C47A43" opacity="0.55" />
    <circle cx="-16" cy="4" r="1.2" fill="#C47A43" opacity="0.6" />
    <circle cx="-10" cy="12" r="1" fill="#C47A43" opacity="0.5" />
    <circle cx="8" cy="-12" r="1.2" fill="#C47A43" opacity="0.55" />
    <circle cx="14" cy="-8" r="1" fill="#C47A43" opacity="0.45" />
    <circle cx="12" cy="10" r="1.1" fill="#C47A43" opacity="0.6" />
    <circle cx="18" cy="16" r="0.9" fill="#C47A43" opacity="0.4" />

    <!-- Pistil (Central Carpellary Stalk & Three-Lobed Stigma) -->
    <path d="M 0 0 C 2 -22 4 -42 6 -56" 
          stroke="#ABC4A3" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <ellipse cx="6" cy="-58" rx="3.5" ry="2.2" fill="#8AA882" stroke="#688A60" stroke-width="0.5" />

    <!-- Elegant Stamens with Prominent Caramel Anthers -->
    <!-- Stamen 1 (Upper Left) -->
    <path d="M 0 0 C -6 -18 -12 -34 -18 -48" 
          stroke="#A65F32" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <ellipse cx="-18" cy="-50" rx="4.2" ry="2" transform="rotate(-30 -18 -50)" 
             fill="url(#caramelAnther)" stroke="#7A3C16" stroke-width="0.5" />

    <!-- Stamen 2 (Upper Right) -->
    <path d="M 0 0 C 0 -20 10 -36 22 -44" 
          stroke="#A65F32" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <ellipse cx="23" cy="-45" rx="4.2" ry="2" transform="rotate(25 23 -45)" 
             fill="url(#caramelAnther)" stroke="#7A3C16" stroke-width="0.5" />

    <!-- Stamen 3 (Lower Left) -->
    <path d="M 0 0 C -14 0 -28 10 -38 14" 
          stroke="#A65F32" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <ellipse cx="-40" cy="15" rx="4.2" ry="2" transform="rotate(75 -40 15)" 
             fill="url(#caramelAnther)" stroke="#7A3C16" stroke-width="0.5" />

    <!-- Stamen 4 (Lower Right) -->
    <path d="M 0 0 C 10 10 22 18 34 24" 
          stroke="#A65F32" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <ellipse cx="36" cy="25" rx="4.2" ry="2" transform="rotate(-40 36 25)" 
             fill="url(#caramelAnther)" stroke="#7A3C16" stroke-width="0.5" />

    <!-- Stamen 5 (Top Center) -->
    <path d="M 0 0 C -2 -25 2 -48 4 -62" 
          stroke="#A65F32" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <ellipse cx="4" cy="-64" rx="4" ry="2" transform="rotate(5 4 -64)" 
             fill="url(#caramelAnther)" stroke="#7A3C16" stroke-width="0.5" />
  </g>
</svg>
