<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <defs>
    <!-- Dark Botanical Foliage Gradients -->
    <linearGradient id="leafGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#363C35" />
      <stop offset="100%" stop-color="#242321" />
    </linearGradient>
    <linearGradient id="leafGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5248" />
      <stop offset="100%" stop-color="#2D332C" />
    </linearGradient>
    
    <!-- White Lily Petal Gradients -->
    <linearGradient id="petalGrad1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF6F0" />
      <stop offset="100%" stop-color="#E8DCB0" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="petalGrad2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#E2D4C3" />
    </linearGradient>
    
    <!-- Caramel Stamen Accents -->
    <linearGradient id="caramelStamen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B47B45" />
      <stop offset="100%" stop-color="#80532F" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#80532F" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Botanical Stems & Dark Leaves -->
  <g filter="url(#softGlow)" opacity="0.95">
    <!-- Main graceful stem -->
    <path d="M 40 400 C 60 320 85 240 130 180 C 150 150 175 120 190 70" 
          stroke="#2D332C" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 75 320 C 110 280 150 260 210 250" 
          stroke="#363C35" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Dark Botanical Leaf 1 (Large curved) -->
    <path d="M 60 350 C 30 300 20 230 65 170 C 85 220 90 280 60 350 Z" 
          fill="url(#leafGradDark)" />
    <path d="M 60 350 C 45 280 50 220 65 170" 
          stroke="#E8D6C0" stroke-width="0.75" stroke-opacity="0.4" fill="none" />

    <!-- Dark Botanical Leaf 2 (Upper left) -->
    <path d="M 85 260 C 50 220 55 150 115 120 C 115 170 110 220 85 260 Z" 
          fill="url(#leafGradMid)" opacity="0.9" />

    <!-- Dark Botanical Leaf 3 (Right pointing) -->
    <path d="M 120 220 C 160 210 215 225 245 200 C 210 220 165 235 120 220 Z" 
          fill="url(#leafGradDark)" />
          
    <!-- Dark Botanical Leaf 4 (Top graceful arch) -->
    <path d="M 160 130 C 180 80 230 50 280 40 C 240 70 205 105 160 130 Z" 
          fill="url(#leafGradMid)" />
  </g>

  <!-- Primary White Lily Flower (Open blossom) -->
  <g transform="translate(130, 100)" filter="url(#softGlow)">
    <!-- Back Petals -->
    <path d="M 0 0 C -45 -50 -70 -10 -55 35 C -35 25 -15 10 0 0 Z" 
          fill="url(#petalGrad2)" stroke="#E8D6C0" stroke-width="0.75" />
    <path d="M 0 0 C 10 -65 50 -70 65 -30 C 50 -5 25 -5 0 0 Z" 
          fill="url(#petalGrad2)" stroke="#E8D6C0" stroke-width="0.75" />
    <path d="M 0 0 C -25 40 -10 75 35 65 C 30 35 15 15 0 0 Z" 
          fill="url(#petalGrad2)" stroke="#E8D6C0" stroke-width="0.75" />

    <!-- Front Graceful Petals -->
    <path d="M 0 0 C -20 -80 15 -100 40 -60 C 25 -30 10 -10 0 0 Z" 
          fill="url(#petalGrad1)" stroke="#E8D6C0" stroke-width="0.8" />
    <path d="M 0 0 C -70 -20 -85 25 -50 60 C -30 40 -15 20 0 0 Z" 
          fill="url(#petalGrad1)" stroke="#E8D6C0" stroke-width="0.8" />
    <path d="M 0 0 C 50 15 80 45 60 85 C 35 60 15 30 0 0 Z" 
          fill="url(#petalGrad1)" stroke="#E8D6C0" stroke-width="0.8" />

    <!-- Petal Rib Centerlines -->
    <path d="M 0 0 C -10 -45 5 -75 25 -50" stroke="#B47B45" stroke-width="0.75" stroke-opacity="0.35" fill="none" />
    <path d="M 0 0 C -40 -5 -50 20 -30 40" stroke="#B47B45" stroke-width="0.75" stroke-opacity="0.35" fill="none" />
    <path d="M 0 0 C 25 15 45 35 35 55" stroke="#B47B45" stroke-width="0.75" stroke-opacity="0.35" fill="none" />

    <!-- Stamens with Caramel Brown Anthers -->
    <path d="M 0 0 C -5 -15 -10 -30 -15 -42" stroke="#80532F" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <ellipse cx="-15" cy="-44" rx="3.5" ry="1.8" transform="rotate(-30 -15 -44)" fill="url(#caramelStamen)" />

    <path d="M 0 0 C 0 -18 8 -32 18 -38" stroke="#80532F" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <ellipse cx="19" cy="-39" rx="3.5" ry="1.8" transform="rotate(25 19 -39)" fill="url(#caramelStamen)" />

    <path d="M 0 0 C -12 0 -24 8 -32 12" stroke="#80532F" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <ellipse cx="-34" cy="13" rx="3.5" ry="1.8" transform="rotate(75 -34 13)" fill="url(#caramelStamen)" />

    <path d="M 0 0 C 8 8 18 16 28 20" stroke="#80532F" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <ellipse cx="30" cy="21" rx="3.5" ry="1.8" transform="rotate(-40 30 21)" fill="url(#caramelStamen)" />

    <!-- Flower Center Pistil -->
    <circle cx="0" cy="0" r="3.5" fill="#B47B45" />
    <circle cx="0" cy="0" r="1.5" fill="#E8D6C0" />
  </g>

  <!-- Secondary Smaller Lily Bud -->
  <g transform="translate(200, 240) scale(0.65)" filter="url(#softGlow)" opacity="0.9">
    <path d="M 0 0 C -25 -40 -15 -70 10 -60 C 25 -30 15 -10 0 0 Z" fill="url(#petalGrad1)" stroke="#E8D6C0" />
    <path d="M 0 0 C 20 -35 35 -60 50 -40 C 40 -15 20 0 0 0 Z" fill="url(#petalGrad2)" stroke="#E8D6C0" />
    <path d="M 5 -10 C 15 -30 25 -45 32 -48" stroke="#80532F" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <ellipse cx="33" cy="-50" rx="3" ry="1.5" fill="url(#caramelStamen)" />
  </g>
</svg>
